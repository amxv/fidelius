name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@v2
      - run: cd docs && bun install --frozen-lockfile
      - run: make check
      - name: Build macOS release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make build-universal VERSION="$VERSION"
          mkdir -p dist/package
          cp dist/fidelius dist/package/fidelius
          cp -R dist/Fidelius.app dist/package/Fidelius.app
          tar -C dist/package -czf dist/fidelius-darwin-universal.tar.gz fidelius Fidelius.app
          (cd dist && shasum -a 256 fidelius-darwin-universal.tar.gz > fidelius-darwin-universal.tar.gz.sha256)
      - name: Smoke test macOS installer
        run: |
          smoke="$(mktemp -d)"
          FIDELIUS_INSTALL_DIR="$smoke/bin" \
          FIDELIUS_ASSET_URL="file://${GITHUB_WORKSPACE}/dist/fidelius-darwin-universal.tar.gz" \
          FIDELIUS_CHECKSUM_URL="file://${GITHUB_WORKSPACE}/dist/fidelius-darwin-universal.tar.gz.sha256" \
            bash scripts/install.sh
          "$smoke/bin/fidelius" --help >/dev/null
          "$smoke/bin/fidelius" --version
          codesign --verify --deep --strict "$smoke/bin/Fidelius.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/fidelius-darwin-universal.tar.gz
            dist/fidelius-darwin-universal.tar.gz.sha256

  linux:
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl make g++ pkg-config libgtk-4-dev qt6-base-dev
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - name: Build and verify Linux package
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(go env GOARCH)" = "$ARCH"
          CGO_ENABLED=0 make build VERSION="${GITHUB_REF_NAME#v}"
          asset="fidelius-linux-$ARCH.tar.gz"
          tar -C dist -czf "dist/$asset" fidelius fidelius-ui
          (cd dist && sha256sum "$asset" > "$asset.sha256")
          smoke="$(mktemp -d)"
          FIDELIUS_INSTALL_DIR="$smoke/bin" XDG_DATA_HOME="$smoke/share" \
            FIDELIUS_ASSET_URL="file://$PWD/dist/$asset" bash scripts/install.sh
          "$smoke/bin/fidelius" --version
          test -x "$(dirname "$(readlink -f "$smoke/bin/fidelius")")/fidelius-ui/qt"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-release
          path: dist/*.tar.gz*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Test Windows core
        run: go test ./...
      - name: Build Windows release
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          make build-windows VERSION=$version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item dist/fidelius-windows-amd64.exe dist/fidelius.exe
          Compress-Archive -Path dist/fidelius.exe -DestinationPath dist/fidelius-windows-amd64.zip
          $hash = (Get-FileHash dist/fidelius-windows-amd64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  fidelius-windows-amd64.zip" | Set-Content -Path dist/fidelius-windows-amd64.zip.sha256
      - name: Smoke test Windows installer
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'fidelius-install-smoke'
          & scripts/install.ps1 -InstallDir $smoke -AssetUrl (Resolve-Path dist/fidelius-windows-amd64.zip).Path -ChecksumUrl (Resolve-Path dist/fidelius-windows-amd64.zip.sha256).Path
          & (Join-Path $smoke 'fidelius.exe') --help | Out-Null
          & (Join-Path $smoke 'fidelius.exe') --version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/fidelius-windows-amd64.zip
            dist/fidelius-windows-amd64.zip.sha256

  publish:
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/fidelius-darwin-universal.tar.gz
            dist/fidelius-darwin-universal.tar.gz.sha256
            dist/fidelius-linux-amd64.tar.gz
            dist/fidelius-linux-amd64.tar.gz.sha256
            dist/fidelius-linux-arm64.tar.gz
            dist/fidelius-linux-arm64.tar.gz.sha256
            dist/fidelius-windows-amd64.zip
            dist/fidelius-windows-amd64.zip.sha256
