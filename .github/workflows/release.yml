name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@v2
      - run: cd docs && bun install --frozen-lockfile
      - run: make check

      - name: Build universal macOS release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make build-universal VERSION="$VERSION"
          mkdir -p dist/package
          cp dist/fidelius dist/package/fidelius
          cp -R dist/Fidelius.app dist/package/Fidelius.app
          tar -C dist/package -czf dist/fidelius-darwin-universal.tar.gz fidelius Fidelius.app
          (cd dist && shasum -a 256 fidelius-darwin-universal.tar.gz > fidelius-darwin-universal.tar.gz.sha256)

      - name: Smoke test installer
        run: |
          smoke="$(mktemp -d)"
          FIDELIUS_INSTALL_DIR="$smoke/bin" \
          FIDELIUS_ASSET_URL="file://${GITHUB_WORKSPACE}/dist/fidelius-darwin-universal.tar.gz" \
          FIDELIUS_CHECKSUM_URL="file://${GITHUB_WORKSPACE}/dist/fidelius-darwin-universal.tar.gz.sha256" \
            bash scripts/install.sh
          "$smoke/bin/fidelius" --help >/dev/null
          "$smoke/bin/fidelius" --version
          codesign --verify --deep --strict "$smoke/bin/Fidelius.app"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/fidelius-darwin-universal.tar.gz
            dist/fidelius-darwin-universal.tar.gz.sha256
