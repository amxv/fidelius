name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@v2
      - run: cd docs && bun install --frozen-lockfile
      - run: make check
      - run: make build-universal VERSION=0.0.0
      - run: |
          file dist/fidelius
          file dist/Fidelius.app/Contents/MacOS/fidelius-ui
          codesign --verify --deep --strict dist/Fidelius.app
