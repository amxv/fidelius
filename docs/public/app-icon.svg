<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3c40"/>
      <stop offset="0.52" stop-color="#24262a"/>
      <stop offset="1" stop-color="#151619"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#e7e4dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- macOS-style icon container with transparent corners -->
  <rect x="66" y="66" width="892" height="892" rx="208" fill="url(#bg)"/>
  <rect x="69" y="69" width="886" height="886" rx="205" fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="6"/>

  <!-- lock mark -->
  <g filter="url(#shadow)">
    <path d="M356 470v-76c0-101 66-174 156-174s156 73 156 174v76"
          fill="none" stroke="url(#lock)" stroke-width="72" stroke-linecap="round"/>
    <rect x="300" y="432" width="424" height="340" rx="92" fill="url(#lock)"/>
    <circle cx="512" cy="581" r="31" fill="#25272b"/>
    <rect x="495" y="602" width="34" height="82" rx="17" fill="#25272b"/>
  </g>
</svg>
